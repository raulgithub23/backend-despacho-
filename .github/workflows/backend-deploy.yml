name: CI/CD Backend — Despachos y Ventas

on:
  push:
    branches:
      - deploy

env:
  IMAGE_DESPACHOS: ${{ secrets.DOCKERHUB_USERNAME }}/backend-despacho
  IMAGE_VENTAS: ${{ secrets.DOCKERHUB_USERNAME }}/backend-ventas

jobs:
  build-despachos:
    name: Build imagen Despachos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push Despachos
        uses: docker/build-push-action@v5
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_DESPACHOS }}:latest
            ${{ env.IMAGE_DESPACHOS }}:${{ github.sha }}

  build-ventas:
    name: Build imagen Ventas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push Ventas
        uses: docker/build-push-action@v5
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          file: ./Dockerfile.ventas
          push: true
          tags: |
            ${{ env.IMAGE_VENTAS }}:latest
            ${{ env.IMAGE_VENTAS }}:${{ github.sha }}

  deploy:
    name: Deploy en EC2 Backend
    runs-on: ubuntu-latest
    needs: [build-despachos, build-ventas]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar docker-compose al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ec2-user/backend"

      - name: Deploy en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/backend

            cat > .env <<EOF
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DOCKER_IMAGE=${{ env.IMAGE_DESPACHOS }}:${{ github.sha }}
            VENTAS_IMAGE=${{ env.IMAGE_VENTAS }}:${{ github.sha }}
            EOF

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker compose down
            docker compose pull
            docker compose up -d

            docker image prune -f
